[project]
name = "jira-workload-worker"
version = "0.1.0"
description = "FastAPI worker that fetches Jira issues and aggregates assignee workload"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.34.0",
  "httpx>=0.28.0",
  "pydantic-settings>=2.7.0",
  "python-dotenv>=1.0.0",
  "mcp>=1.9.0",
  "email-validator>=2.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.25.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
